name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    uses: groovemap-music/automation/.github/workflows/reusable-ci.yml@833cb464507678c38ab78bd4718ce697399463e9
    with:
      runner: ubuntu-24.04
      language: python
      setup-command: just setup
      check-command: just check
      coverage-command: just test
      audit-command: just audit
      license-command: just license-check
      secret-scan-command: just secret-scan
      package-command: just build
      install-command: just install-check
      image-command: just image
      coverage-files: coverage.xml
      coverage-flags: python,discogs,postgres
      upload-codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
