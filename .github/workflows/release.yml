name: Publish image

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    uses: groovemap-music/automation/.github/workflows/reusable-release.yml@833cb464507678c38ab78bd4718ce697399463e9
    with:
      repository-name: discogs-sql-loader
      setup-command: just setup
      check-command: just check
      release-command: just release-dry-run
      artifact-path: |
        dist/*.whl
        dist/*.tar.gz
        dist/provenance.json
      publish-image: true
      prepare-image-command: just prepare-runtime-wheel
