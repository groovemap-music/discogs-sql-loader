[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "groovemap-discogs-sql-loader"
version = "0.1.1"
description = "Consume Discogs events and build GrooveMap analytical PostgreSQL tables"
authors = [{name = "Robert Wlodarczyk", email = "robert@simplicityguy.com"}]
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aio-pika>=10.0.1",
    "groovemap-runtime[otel,postgres,rabbitmq]==0.1.0",
    "orjson>=3.12.0",
    "psycopg[binary]>=3.3.4",
    "structlog>=26.1.0",
]

[project.scripts]
discogs-sql-loader = "tableinator.tableinator:cli"

[project.urls]
Homepage = "https://groovemap.music"
Repository = "https://github.com/groovemap-music/discogs-sql-loader"
Issues = "https://github.com/groovemap-music/discogs-sql-loader/issues"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "commitizen>=4.18.0",
    "cyclonedx-bom>=7.3.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["tableinator"]

[tool.uv]
exclude-newer = "2 days"

[tool.uv.sources]
groovemap-runtime = { git = "https://github.com/groovemap-music/python-libraries.git", rev = "3c8309bfb6123b2c85107e949e9d626e3193db6d" }

[tool.ruff]
extend-exclude = ["tableinator/catalog_contract.py"]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["ARG", "B", "C4", "E", "F", "I", "PLC", "PTH", "RUF", "S", "SIM", "T20", "TCH", "UP", "W"]
ignore = ["B008", "C901", "E501", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["tableinator"]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tableinator/tableinator.py" = ["T201"]
"tests/**/*.py" = ["PLC", "S105", "T201"]
"scripts/*.py" = ["S108", "T201"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
packages = ["tableinator"]

[[tool.mypy.overrides]]
module = ["aio_pika.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"
markers = [
    "benchmark: performance regression benchmarks",
    "e2e: end-to-end tests requiring external services",
    "integration: tests requiring a live backing service",
]

[tool.coverage.run]
source = ["tableinator"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
version_files = ["tableinator/__init__.py:__version__"]
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
